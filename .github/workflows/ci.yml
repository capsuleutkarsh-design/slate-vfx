name: Slate CI

on:
  push:
    branches:
      - "**"
  pull_request:

env:
  # A CI runner has no desktop session. Qt's default platform plugin needs one
  # and aborts without it, which takes down every test that builds a widget -
  # and that is most of this suite. "offscreen" renders into memory instead.
  QT_QPA_PLATFORM: offscreen

jobs:
  validate:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The version the studio actually runs. setup.bat installs 3.10.11 and
      # the studio's portable runtime is 3.10.21, so testing 3.11 here was
      # testing a Python nobody uses.
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Poetry
        run: python -m pip install --upgrade pip poetry

      - name: Install dependencies
        run: poetry install --with dev --no-interaction --no-root

      # -----------------------------------------------------------------------
      # The steps below are deliberately split rather than one pytest call.
      # A job's step conclusions can be read without a token; its logs cannot.
      # So when this goes red, which step went red is itself the diagnosis.
      #
      # There is no studio database on a runner and no local config pointing at
      # one, so Slate falls back to SQLite - which is the behaviour that makes
      # this suite runnable on a machine that has never seen the studio.
      # -----------------------------------------------------------------------

      # Run plainly, and let pytest's own exit code stand.
      #
      # These were briefly wrapped in PowerShell that captured the output with
      # 2>&1 so failures could be re-emitted as annotations. That wrapper made
      # every step fail while every test passed: QtWebEngine writes WebGL
      # chatter to stderr, 2>&1 turns a native command's stderr into PowerShell
      # error records, and the exit code is lost. The annotations then reported
      # the chatter as the cause. It found two real bugs first - an undeclared
      # sqlalchemy and a test that assumed FFmpeg - and was removed once it had.
      #
      # --tb=short -rf keeps a failure readable in the log, and the step split
      # below still says which area broke without opening anything.

      - name: Compile every module
        if: always()
        run: poetry run python -m compileall -q ut_vfx ut_server tools tests

      - name: Qt starts headless
        if: always()
        run: poetry run python -c "from PySide6.QtWidgets import QApplication; a = QApplication([]); print('qt ok:', a.platformName())"

      - name: The rules - no Qt, no database
        if: always()
        run: poetry run pytest tests/test_workplace_domain.py -q -o addopts='' -p no:cacheprovider --tb=short -rf

      - name: Unit tests
        if: always()
        run: poetry run pytest tests -q -o addopts='' -p no:cacheprovider --tb=short -rf --ignore=tests/gui --ignore=tests/integration --ignore=tests/legacy_root --ignore=tests/manual --ignore=tests/verification_scripts

      - name: Integration tests
        if: always()
        run: poetry run pytest tests/integration -q -o addopts='' -p no:cacheprovider --tb=short -rf

      - name: Legacy tests
        if: always()
        run: poetry run pytest tests/legacy_root -q -o addopts='' -p no:cacheprovider --tb=short -rf

      - name: Manual and verification scripts
        if: always()
        run: poetry run pytest tests/manual tests/verification_scripts -q -o addopts='' -p no:cacheprovider --tb=short -rf

      - name: Tests that build windows
        if: always()
        run: poetry run pytest tests/gui -q -o addopts='' -p no:cacheprovider --tb=short -rf
