name: Slate CI

on:
  push:
    branches:
      - "**"
  pull_request:

env:
  # A CI runner has no desktop session. Qt's default platform plugin needs one
  # and aborts without it, which takes down every test that builds a widget -
  # and that is most of this suite. "offscreen" renders into memory instead.
  QT_QPA_PLATFORM: offscreen

jobs:
  validate:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The version the studio actually runs. setup.bat installs 3.10.11 and
      # the studio's portable runtime is 3.10.21, so testing 3.11 here was
      # testing a Python nobody uses.
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Poetry
        run: python -m pip install --upgrade pip poetry

      - name: Install dependencies
        run: poetry install --with dev --no-interaction --no-root

      # -----------------------------------------------------------------------
      # The steps below are deliberately split rather than one pytest call.
      # A job's step conclusions can be read without a token; its logs cannot.
      # So when this goes red, which step went red is itself the diagnosis.
      #
      # There is no studio database on a runner and no local config pointing at
      # one, so Slate falls back to SQLite - which is the behaviour that makes
      # this suite runnable on a machine that has never seen the studio.
      # -----------------------------------------------------------------------

      - name: Compile every module
        if: always()
        shell: pwsh
        run: |
          $out = (poetry run python -m compileall -q ut_vfx ut_server tools tests 2>&1 | Out-String)
          Write-Host $out
          if ($LASTEXITCODE -ne 0) {
            $lines = ($out -split "`n") |
              Where-Object { $_ -notmatch 'qtwebengine|chromium|WebGL|ContextResult|command_buffer|GpuChannelHost' }
            # pytest's own summary first - the -rf list and the counts are the
            # answer. Tracebacks are the runner-up, and only if there is room.
            $keep = @(
              $lines | Where-Object { $_ -match '^(FAILED|ERROR) ' }
              $lines | Where-Object { $_ -match '^\d+ (failed|error)' }
              $lines | Where-Object { $_ -match '^E\s|\S+Error:' }
            ) | Select-Object -Unique -First 20
            foreach ($line in $keep) {
              $clean = ($line.Trim() -replace '::', ' - ')
              Write-Host "::error title=Compile every module::$clean"
            }
            exit 1
          }

      - name: Qt starts headless
        if: always()
        shell: pwsh
        run: |
          $out = (poetry run python -c "from PySide6.QtWidgets import QApplication; a = QApplication([]); print('qt ok:', a.platformName())" 2>&1 | Out-String)
          Write-Host $out
          if ($LASTEXITCODE -ne 0) {
            $keep = ($out -split "`n") |
              Where-Object { $_ -match '^(FAILED|ERROR|E\s|\S+Error:|assert |\d+ failed)' } |
              Select-Object -First 20
            foreach ($line in $keep) {
              $clean = ($line.Trim() -replace '::', ' - ')
              Write-Host "::error title=Qt starts headless::$clean"
            }
            exit 1
          }

      - name: The rules - no Qt, no database
        if: always()
        shell: pwsh
        run: |
          $out = (poetry run pytest tests/test_workplace_domain.py -q -o addopts='' -p no:cacheprovider --tb=line -rf 2>&1 | Out-String)
          Write-Host $out
          if ($LASTEXITCODE -ne 0) {
            $keep = ($out -split "`n") |
              Where-Object { $_ -match '^(FAILED|ERROR|E\s|\S+Error:|assert |\d+ failed)' } |
              Select-Object -First 20
            foreach ($line in $keep) {
              $clean = ($line.Trim() -replace '::', ' - ')
              Write-Host "::error title=The rules - no Qt, no database::$clean"
            }
            exit 1
          }

      - name: Unit tests
        if: always()
        shell: pwsh
        run: |
          $out = (poetry run pytest tests -q -o addopts='' -p no:cacheprovider --tb=line -rf --ignore=tests/gui --ignore=tests/integration --ignore=tests/legacy_root --ignore=tests/manual --ignore=tests/verification_scripts 2>&1 | Out-String)
          Write-Host $out
          if ($LASTEXITCODE -ne 0) {
            $keep = ($out -split "`n") |
              Where-Object { $_ -match '^(FAILED|ERROR|E\s|\S+Error:|assert |\d+ failed)' } |
              Select-Object -First 20
            foreach ($line in $keep) {
              $clean = ($line.Trim() -replace '::', ' - ')
              Write-Host "::error title=Unit tests::$clean"
            }
            exit 1
          }

      - name: Integration tests
        if: always()
        shell: pwsh
        run: |
          $out = (poetry run pytest tests/integration -q -o addopts='' -p no:cacheprovider --tb=line -rf 2>&1 | Out-String)
          Write-Host $out
          if ($LASTEXITCODE -ne 0) {
            $keep = ($out -split "`n") |
              Where-Object { $_ -match '^(FAILED|ERROR|E\s|\S+Error:|assert |\d+ failed)' } |
              Select-Object -First 20
            foreach ($line in $keep) {
              $clean = ($line.Trim() -replace '::', ' - ')
              Write-Host "::error title=Integration tests::$clean"
            }
            exit 1
          }

      - name: Legacy tests
        if: always()
        shell: pwsh
        run: |
          $out = (poetry run pytest tests/legacy_root -q -o addopts='' -p no:cacheprovider --tb=line -rf 2>&1 | Out-String)
          Write-Host $out
          if ($LASTEXITCODE -ne 0) {
            $keep = ($out -split "`n") |
              Where-Object { $_ -match '^(FAILED|ERROR|E\s|\S+Error:|assert |\d+ failed)' } |
              Select-Object -First 20
            foreach ($line in $keep) {
              $clean = ($line.Trim() -replace '::', ' - ')
              Write-Host "::error title=Legacy tests::$clean"
            }
            exit 1
          }

      - name: Manual and verification scripts
        if: always()
        shell: pwsh
        run: |
          $out = (poetry run pytest tests/manual tests/verification_scripts -q -o addopts='' -p no:cacheprovider --tb=line -rf 2>&1 | Out-String)
          Write-Host $out
          if ($LASTEXITCODE -ne 0) {
            $keep = ($out -split "`n") |
              Where-Object { $_ -match '^(FAILED|ERROR|E\s|\S+Error:|assert |\d+ failed)' } |
              Select-Object -First 20
            foreach ($line in $keep) {
              $clean = ($line.Trim() -replace '::', ' - ')
              Write-Host "::error title=Manual and verification scripts::$clean"
            }
            exit 1
          }

      - name: Tests that build windows
        if: always()
        shell: pwsh
        run: |
          $out = (poetry run pytest tests/gui -q -o addopts='' -p no:cacheprovider --tb=line -rf 2>&1 | Out-String)
          Write-Host $out
          if ($LASTEXITCODE -ne 0) {
            $keep = ($out -split "`n") |
              Where-Object { $_ -match '^(FAILED|ERROR|E\s|\S+Error:|assert |\d+ failed)' } |
              Select-Object -First 20
            foreach ($line in $keep) {
              $clean = ($line.Trim() -replace '::', ' - ')
              Write-Host "::error title=Tests that build windows::$clean"
            }
            exit 1
          }
